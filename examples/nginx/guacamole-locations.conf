# /etc/nginx/snippets/guacamole-locations.conf
# Replace SECRET_PATH with the value of WEBAPP_CONTEXT given to the guacamole container.
# Guacamole lives only under a secret path.
# Everything else, including /guacamole/, is a plain 404.

location / {
    return 404;
}

# Neutral favicon from the branding extension instead of the Guacamole logo
location ~ ^/SECRET_PATH/images/logo-(64|144)\.png$ {
    proxy_pass http://127.0.0.1:8080/SECRET_PATH/app/ext/branding/icon-$1.png;
}

location = /SECRET_PATH/api/tokens {
    limit_req zone=guac_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080/SECRET_PATH/api/tokens;
    include snippets/guacamole-proxy.conf;
}

location /SECRET_PATH/ {
    proxy_pass http://127.0.0.1:8080/SECRET_PATH/;
    include snippets/guacamole-proxy.conf;
}
