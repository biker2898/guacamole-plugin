[package]
name = "rust-portal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
hex = "0.4"
ironrdp-cliprdr = "0.9"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-pdu = "0.11"
ironrdp-rdpdr = "0.9"
ironrdp-rdpsnd = "0.11"
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
ironrdp-tls = { version = "0.3", features = ["rustls"] }
ironrdp-tokio = "0.12"
openh264 = "0.9"
# Raw SetOption types (same version as openh264 uses).
openh264-sys2 = "0.9"
opus = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "macros", "migrate"] }
str0m = "0.25"
subtle = "2"
tokio = { version = "1", features = ["full"] }
totp-rs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
debug = 1
