# Live copy of /etc/nginx/sites-available/portal.vigor.buzz with the Guacamole
# WEBAPP_CONTEXT replaced by SECRET_PATH. This name stays Guacamole; the Rust
# Portal is served only at rust.vgrtech.my.id.
# Apache Guacamole (docker compose in ~/docker/guacamole) behind Cloudflare,
# served under a secret path. TLS uses the Cloudflare origin certificate.
server {
    listen 80;
    listen [::]:80;
    server_name portal.vigor.buzz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.vigor.buzz;
    ssl_certificate     /etc/ssl/cloudflare/vigor.buzz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vigor.buzz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    error_log  /var/log/nginx/portal.vigor.buzz.error.log;

    # Take the client IP from Cloudflare, only when the request comes from
    # Cloudflare (https://www.cloudflare.com/ips/), so the login rate limit
    # and the Guacamole ban hit the real client and not Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Root goes straight to the login page (this reveals the secret path)
    location = / {
        return 302 /SECRET_PATH/;
    }
    include snippets/guacamole-locations.conf;
}
