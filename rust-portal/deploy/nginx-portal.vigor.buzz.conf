# Rust Portal at portal.vigor.buzz, behind Cloudflare (since 2026-11-13; before
# that this name served Guacamole). Pages and the signaling WebSocket go
# through Cloudflare; WebRTC media goes straight to the box over UDP.
# TLS uses the Cloudflare origin certificate.
server {
    listen 80;
    listen [::]:80;
    server_name portal.vigor.buzz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.vigor.buzz;
    ssl_certificate     /etc/ssl/cloudflare/vigor.buzz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vigor.buzz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    error_log  /var/log/nginx/portal.vigor.buzz.error.log;
    # Client IP from Cloudflare, trusted only from Cloudflare addresses
    # (https://www.cloudflare.com/ips/), so rust-portal logs and limits the real client.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
