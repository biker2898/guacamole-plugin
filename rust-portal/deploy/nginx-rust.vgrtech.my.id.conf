# Rust Portal at rust.vgrtech.my.id: DNS-only record (no Cloudflare proxy, it
# cannot carry the WebRTC UDP media). Let's Encrypt cert via certbot.
server {
    listen 80;
    listen [::]:80;
    server_name rust.vgrtech.my.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rust.vgrtech.my.id;
    ssl_certificate     /etc/letsencrypt/live/rust.vgrtech.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rust.vgrtech.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    error_log  /var/log/nginx/rust.vgrtech.my.id.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
