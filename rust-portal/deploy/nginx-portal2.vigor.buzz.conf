# Live copy of /etc/nginx/sites-available/portal2.vigor.buzz with the Guacamole
# WEBAPP_CONTEXT replaced by SECRET_PATH. This name stays Guacamole; the Rust
# Portal is served only at rust.vgrtech.my.id.
# Guacamole at portal2.vigor.buzz: DNS-only record (no Cloudflare proxy),
# for users who find the proxied portal.vigor.buzz laggy. Browsers reach it
# directly, so it needs a public certificate: Let's Encrypt, renewed by
# certbot (nginx plugin). The Cloudflare origin certificate is not trusted
# by browsers.
server {
    listen 80;
    listen [::]:80;
    server_name portal2.vigor.buzz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/3 (QUIC over UDP 443, opened in the Tencent security group on
    # 2026-11-14). Browsers learn it from Alt-Svc on their first TCP request.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http3 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name portal2.vigor.buzz;

    ssl_certificate     /etc/letsencrypt/live/portal2.vigor.buzz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal2.vigor.buzz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    error_log  /var/log/nginx/portal2.vigor.buzz.error.log;

    # Clients connect directly; CF-Connecting-IP is only trusted from
    # Cloudflare addresses (conf.d/cloudflare-realip.conf), so it cannot be
    # spoofed here.

    location = / {
        return 302 /SECRET_PATH/;
    }

    include snippets/livekit-locations.conf;
    # Browsers cannot run WebSocket over HTTP/3, so refuse the WebSocket
    # tunnel here: the Guacamole client then falls back to its HTTP tunnel,
    # whose requests do go over QUIC. The session-tools ping meter times its
    # own requests in that case.
    location = /SECRET_PATH/websocket-tunnel {
        return 404;
    }
    include snippets/guacamole-locations.conf;
}
