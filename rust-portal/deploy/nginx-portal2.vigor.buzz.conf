# Rust Portal at portal2.vigor.buzz (since 2026-11-13; before that this name
# served Guacamole, which stays at portal.vigor.buzz/<GUAC_PATH>/).
# DNS-only record (no Cloudflare proxy, it cannot carry the WebRTC UDP media).
# Let's Encrypt cert, renewed by certbot (nginx plugin).
server {
    listen 80;
    listen [::]:80;
    server_name portal2.vigor.buzz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal2.vigor.buzz;
    ssl_certificate     /etc/letsencrypt/live/portal2.vigor.buzz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal2.vigor.buzz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    error_log  /var/log/nginx/portal2.vigor.buzz.error.log;

    include snippets/livekit-locations.conf;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
